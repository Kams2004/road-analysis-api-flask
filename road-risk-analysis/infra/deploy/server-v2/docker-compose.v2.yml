# VIASafe v2 — complete, separate stack for the server (project name: viasafe-v2).
#
# Runs NEXT TO the existing production deployment without touching it:
#   - own Docker project / network / volumes / container names (viasafe-v2-*)
#   - own Postgres, Redis, MinIO and Cameroon OSRM (internal only, no host port)
#   - four host ports, all configurable in .env (defaults 18080 / 13000 / 19200 / 18085)
# Production keeps the host network ports it already uses (8080 API, 6379 Redis,
# the frontend, native Postgres/MinIO) — none of them is bound here.
#
# Started by deploy.sh (which checks the ports are free first):
#   docker compose -p viasafe-v2 -f docker-compose.v2.yml --env-file .env up -d --build
#
# Server layout (written by push.sh), paths below are relative to this file
# (~/viasafe-v2/infra/deploy/server-v2):
#   ~/viasafe-v2/backend    API / worker image build context
#   ~/viasafe-v2/web        web console image build context
#   ~/viasafe-v2/infra      this kit, osrm/ image, secrets/ (sftp.env, chmod 600)
#   ~/viasafe-v2/ai/models  installed weights + cards (mounted read-only on /models)
#   ~/viasafe-v2/docs       documentation

name: viasafe-v2

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://viasafe:${DB_PASSWORD}@db:5432/viasafe
  REDIS_URL: redis://redis:6379/2
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  OSRM_BASE_URL: http://osrm:5000
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_USER}
  MINIO_SECRET_KEY: ${MINIO_PASSWORD}
  MINIO_SECURE: "false"
  AUTH_ENFORCED: "true"
  SECRET_KEY: ${SECRET_KEY}
  BOOTSTRAP_ADMIN_EMAIL: ${ADMIN_EMAIL}
  BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  HISTORICAL_YMANE_SYNC_ENABLED: "false"
  TEMP_DIR: /tmp/road_analysis
  WEB_BASE_URL: ${WEB_URL}                       # e-mail / report links (deploy.sh)
  CLOUD_OAUTH_BASE_URL: ${CLOUD_OAUTH_BASE_URL}  # Google / Microsoft sign-in return address (deploy.sh)
  OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}     # AI threads per video job (one job per worker process)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: viasafe
      POSTGRES_USER: viasafe
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viasafe -d viasafe"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Self-preparing: the first boot downloads the Cameroon extract (~220 MB) and
  # compiles it (several minutes); later boots reuse the osrm_data volume.
  osrm:
    build:
      context: ../../osrm
    image: viasafe-v2-osrm:cameroon
    environment:
      OSRM_REGION: cameroon
    volumes:
      - osrm_data:/data
    restart: unless-stopped

  minio:
    # MinIO no longer publishes images on Docker Hub: this exact image is shipped
    # from the dev PC (see push.sh --minio) and is never pulled.
    image: minio/minio:latest
    pull_policy: never
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${PUBLISH_ADDR:-0.0.0.0}:${MEDIA_PORT:-19200}:9000"     # images for the mobile app (127.0.0.1 with HTTPS)
    restart: unless-stopped

  api:
    build:
      context: ../../../backend
    image: viasafe-v2-api:latest
    # API_WORKERS processes share the load (start-up work is serialised by a Postgres lock);
    # each has DB_POOL_SIZE + DB_MAX_OVERFLOW connections at most.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers ${API_WORKERS:-2} --timeout-keep-alive 15
    environment: *api-env
    volumes:
      - ../../../ai/models:/models:ro
      - ../../secrets:/app/secrets:ro     # SFTP passwords: ~/viasafe-v2/infra/secrets/sftp.env (chmod 600)
      - uploads:/tmp/road_analysis
      - ocr_models:/root/.paddleocr       # PaddleOCR models: downloaded once, kept across redeploys
    ports:
      - "${PUBLISH_ADDR:-0.0.0.0}:${API_PORT:-18080}:8080"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  worker:
    image: viasafe-v2-api:latest
    command: celery -A app.workers.celery_app worker -Q processing --concurrency=${WORKER_CONCURRENCY:-1} --loglevel=info
    environment: *api-env
    volumes:
      - ../../../ai/models:/models:ro
      - ../../secrets:/app/secrets:ro
      - uploads:/tmp/road_analysis
      - ocr_models:/root/.paddleocr
    depends_on: [api]
    restart: unless-stopped

  beat:
    image: viasafe-v2-api:latest
    command: celery -A app.workers.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule
    environment: *api-env
    depends_on: [api]
    restart: unless-stopped

  # Demo units for the collision module (waves towards the phone).
  # Test phase: OFF by default — only started with `--profile demo`
  # (./deploy.sh --with-demo).
  simulator:
    profiles: ["demo"]
    image: viasafe-v2-api:latest
    command: python -u -m app.demo.vehicle_simulator
    environment:
      API_BASE_URL: http://api:8080
      API_KEY: ${SIM_API_KEY}
      SIM_OSRM_URL: http://osrm:5000
      SIM_MODE: ${SIM_MODE:-presentation}
      SIM_NUM_VEHICLES: "6"
      SIM_TICK_SECONDS: "1"
      SIM_WAVE_SECONDS: "40"
      SIM_UNITS_PER_WAVE: "4"
    depends_on: [api, osrm]
    restart: unless-stopped

  # Box review of the training data (web console → Training data → "Send to Label Studio").
  # Admin login + API token: ~/viasafe-v2/infra/secrets/labelstudio.env (generated by
  # deploy.sh, chmod 600; the API reads the same file). Capped at 2 CPUs / 2 GB.
  labelstudio:
    image: heartexlabs/label-studio:1.23.2
    env_file: ../../secrets/labelstudio.env
    environment:                      # its public address (links, CSRF) — set by deploy.sh
      LABEL_STUDIO_HOST: ${LS_PUBLIC_URL}
      CSRF_TRUSTED_ORIGINS: ${LS_PUBLIC_URL}
    volumes:
      - ls_data:/label-studio/data
    ports:
      - "${PUBLISH_ADDR:-0.0.0.0}:${LS_PORT:-18085}:8080"
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped

  web:
    build:
      context: ../../../web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}       # set by deploy.sh (https://api.<domain> with HTTPS)
    image: viasafe-v2-web:latest
    environment:
      API_URL: http://api:8080
      MINIO_URL: http://minio:9000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}     # true with HTTPS (deploy.sh)
    ports:
      - "${PUBLISH_ADDR:-0.0.0.0}:${WEB_PORT:-13000}:3001"
    depends_on: [api]
    restart: unless-stopped

  # HTTPS (profile "https", started by deploy.sh when HTTPS_DOMAIN is set): Let's Encrypt
  # certificates obtained and renewed automatically, see Caddyfile. Ports 80 + 443.
  caddy:
    profiles: ["https"]
    image: caddy:2.10.2-alpine
    environment:
      HTTPS_DOMAIN: ${HTTPS_DOMAIN:-}
      API_HOST: ${API_HOST:-}
      MEDIA_HOST: ${MEDIA_HOST:-}
      LABELS_HOST: ${LABELS_HOST:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on: [web, api]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  ocr_models:
  ls_data:
  db_data:
  osrm_data:
  minio_data:
  uploads:
