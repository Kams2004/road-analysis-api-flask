version: "3.9"

# Legacy production stack (road-analysis-api-flask server).
# PostgreSQL and MinIO run natively on the server (not in Docker).
# api and worker use host networking to reach them on 127.0.0.1.
#
# Run from infra/:  docker compose up -d --build
# Paths are relative to this file: ../backend (code), ../ai/models (weights),
# ./secrets (SFTP passwords), ./.env (settings, written by setup-server.sh).

services:
  api:
    build: ../backend
    network_mode: host          # binds to host port 8080 directly
    env_file: .env
    volumes:
      - ../ai/models:/models:ro
      - ../backend/app:/app/app:ro
      - ./secrets:/app/secrets:ro      # SFTP passwords (infra/secrets/sftp.env), never in the image
      - /tmp/road_analysis:/tmp/road_analysis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ../backend
    # Hard upper bound of jobs running at once; the runtime limit is the
    # `processing.max_concurrent_jobs` platform setting (Settings → Platform).
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-4} -Q processing
    network_mode: host
    env_file: .env
    volumes:
      - ../ai/models:/models:ro
      - ../backend/app:/app/app:ro
      - ./secrets:/app/secrets:ro
      - /tmp/road_analysis:/tmp/road_analysis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: ../backend
    # Schedules periodic tasks (Ymane historical-event sync — off by default,
    # see settings.HISTORICAL_YMANE_SYNC_ENABLED — plus the Module 7 stale-job
    # watchdog, failed-media cleanup, cloud folder sync and stream capture) onto the
    # same "processing" queue the `worker` service already consumes. This
    # container only enqueues on schedule; it never executes tasks itself.
    command: celery -A app.workers.celery_app beat --loglevel=info
    network_mode: host
    env_file: .env
    volumes:
      - ../backend/app:/app/app:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    network_mode: host          # listens on host 127.0.0.1:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
