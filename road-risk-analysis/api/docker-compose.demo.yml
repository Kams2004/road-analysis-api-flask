version: "3.9"

# ── Standalone demo stack for the collision-prevention pipeline (Steps 1-3):
#    live vehicle telemetry, OSRM road-aware map-matching, and trajectory
#    prediction ─────────────────────────────────────────────────────────────
#
# Spins up its own Postgres + Redis + self-preparing Cameroon OSRM in
# containers (isolated from the host's native Postgres/MinIO used by the
# production deployment — see docker-compose.yml) plus the API and a
# fake-vehicle simulator, so a single phone running the viasafe-mobile app
# can see other vehicles "driving" around it, on the real road network,
# without needing a second physical device.
#
# No detection/video pipeline here on purpose — no worker, no model
# volume (MinIO only serves seeded demo media, see seed_mobile_demo.py).
# Reuses the already-built app image but mounts the live ./app source over
# it (same trick as docker-compose.yml) so current code always runs even
# though the image itself is stale.
#
# Usage:
#   docker-compose -f docker-compose.demo.yml up --build
#   (find your LAN IP with `hostname -I`, then set EXPO_PUBLIC_API_URL to
#    http://<that-ip>:8080 in viasafe-mobile before running Expo)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: road_analysis
      POSTGRES_USER: road_api
      POSTGRES_PASSWORD: demo_password
    volumes:
      - demo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U road_api -d road_analysis"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Self-preparing OSRM against the real Cameroon road network — see
  # osrm/Dockerfile / osrm/docker-entrypoint.sh. First boot downloads and
  # compiles the extract (~220MB download, several minutes to compile);
  # later restarts reuse the compiled data in ./osrm/data and start in
  # seconds. api's OSRM_BASE_URL below points at this instead of the public
  # demo server.
  osrm:
    build:
      context: ./osrm
    image: road-analysis-osrm:cameroon
    environment:
      OSRM_REGION: cameroon
    volumes:
      - ./osrm/data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --tries=1 http://localhost:5000/route/v1/driving/9.7,4.05;9.71,4.06 || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30m

  # Object storage for detection crops / report photos. Host port 9200 is
  # what the web console's media proxy (MINIO_URL default
  # http://localhost:9200) and the phone (`adb reverse tcp:9200 tcp:9200`,
  # EXPO_PUBLIC_MINIO_URL=http://localhost:9200) read from. Buckets are made
  # anonymous-read by app/demo/seed_mobile_demo.py so the app can load image
  # URLs directly. Console: http://localhost:9201.
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9201
    environment:
      MINIO_ROOT_USER: demo_minio
      MINIO_ROOT_PASSWORD: demo_minio_password
    volumes:
      - demo_minio_data:/data
    ports:
      - "9200:9000"
      - "9201:9201"

  api:
    image: road-analysis-api_api:latest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    environment:
      DATABASE_URL: postgresql+asyncpg://road_api:demo_password@db:5432/road_analysis
      REDIS_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OSRM_BASE_URL: http://osrm:5000
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: demo_minio
      MINIO_SECRET_KEY: demo_minio_password
      MINIO_SECURE: "false"
      # Demo stack stays open so an unconfigured phone and the simulator keep
      # working; login/users/roles still function for the web console.
      AUTH_ENFORCED: "false"
      BOOTSTRAP_ADMIN_EMAIL: admin@viasafe.local
      BOOTSTRAP_ADMIN_PASSWORD: ChangeMe123
    volumes:
      - ./app:/app/app:ro
      # SFTP passwords (secrets/sftp.env). The running local container
      # (roaddemo_api_1) was created before this line: until it is recreated,
      # copy the file in instead — see docs/SFTP-SOURCE.md ("Local test stack").
      - ./secrets:/app/secrets:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Demo unit simulator — off by default (test phase); start it with
  # `docker compose ... --profile demo up -d simulator`.
  simulator:
    profiles: ["demo"]
    image: road-analysis-api_api:latest
    command: python -u -m app.demo.vehicle_simulator
    environment:
      API_BASE_URL: http://api:8080
      SIM_OSRM_URL: http://osrm:5000
      # presentation = waves of units coming at the phone (every alert level,
      # grouped alarms, units leaving — see app/demo/sim_presentation.py);
      # roam = the original wandering units. docker-compose 1.29 cannot recreate
      # this container on the current Docker (KeyError 'ContainerConfig') —
      # switch modes with the docker run commands in docs/PRESENTATION.md.
      SIM_MODE: "${SIM_MODE:-presentation}"
      SIM_NUM_VEHICLES: "6"
      SIM_TICK_SECONDS: "${SIM_TICK_SECONDS:-1}"
      SIM_WAVE_SECONDS: "${SIM_WAVE_SECONDS:-40}"
      SIM_UNITS_PER_WAVE: "${SIM_UNITS_PER_WAVE:-4}"
    volumes:
      - ./app:/app/app:ro
    depends_on:
      - api
      - osrm
    restart: unless-stopped

volumes:
  demo_db_data:
  demo_minio_data:
