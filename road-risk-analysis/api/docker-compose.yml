version: "3.9"

# PostgreSQL and MinIO run natively on the server (not in Docker).
# api and worker use host networking to reach them on 127.0.0.1.

services:
  api:
    build: .
    network_mode: host          # binds to host port 8080 directly
    env_file: .env
    volumes:
      - ./models:/models:ro
      - ./app:/app/app:ro
      - /tmp/road_analysis:/tmp/road_analysis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -Q processing
    network_mode: host
    env_file: .env
    volumes:
      - ./models:/models:ro
      - ./app:/app/app:ro
      - /tmp/road_analysis:/tmp/road_analysis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: .
    # Schedules periodic tasks (currently: Ymane historical-event sync,
    # off by default — see settings.HISTORICAL_YMANE_SYNC_ENABLED) onto the
    # same "processing" queue the `worker` service already consumes. This
    # container only enqueues on schedule; it never executes tasks itself.
    command: celery -A app.workers.celery_app beat --loglevel=info
    network_mode: host
    env_file: .env
    volumes:
      - ./app:/app/app:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    network_mode: host          # listens on host 127.0.0.1:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
